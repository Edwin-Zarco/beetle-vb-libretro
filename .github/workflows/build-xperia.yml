name: Build beetle-vb (Xperia Play / Android 4.0.4)

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The VR/stereo-GL path is only compiled when GLES is on. A phone build that
  # plays normal Virtual Boy output doesn't need it, so it's off by default.
  ENABLE_GLES: "0"
  ENABLE_VR: "0"

  # Cortex-A8 (Scorpion) + NEON, softfp ABI as required by armeabi-v7a
  OPT_FLAGS: >-
    -O3 -marm -DNDEBUG
    -mcpu=cortex-a8 -mtune=cortex-a8 -mfpu=neon -mfloat-abi=softfp
    -ffast-math -fno-math-errno -funroll-loops
    -fvectorize -fslp-vectorize
    -fomit-frame-pointer -fno-stack-protector -fno-ident -fno-plt
    -fmerge-all-constants -fvisibility=hidden
    -fno-unwind-tables -fno-asynchronous-unwind-tables
    -fdata-sections -ffunction-sections -flto
  # The core source has no try/throw/catch/dynamic_cast/typeid and no std:: use.
  CXX_OPT_FLAGS: -fno-exceptions -fno-rtti
  LD_OPT_FLAGS: >-
    -flto -Wl,--lto-O3 -Wl,--gc-sections -Wl,--icf=all -Wl,-O2
    -Wl,--as-needed -Wl,--hash-style=both -Wl,--build-id=none
    -Wl,-z,norelro -Wl,--exclude-libs,ALL

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Source optimisation: replaces the per-pixel framebuffer expansion in
      # vip.c with a byte -> 4-pixel lookup table. The patch is embedded
      # below, so the repo needs no extra files. --check runs first, so a
      # changed upstream file fails with a clear error, not a partial patch.
      - name: Test expansion equivalence (host)
        run: |
          cat > /tmp/vb-anaglyph-lut-test.c <<'TEST_EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          /* Old: per-pixel loop; New: LUT. Brightness CLUT random. */
          static uint32_t BrightCLUT[2][4], Byte4LUT[2][256][4];
          int main(void){
            srand(1);
            for(int trial=0; trial<10000; trial++){
              for(int lr=0;lr<2;lr++) for(int i=0;i<4;i++) BrightCLUT[lr][i]=(uint32_t)rand()*2654435761u;
              for(int lr=0;lr<2;lr++) for(int i=0;i<256;i++) for(int k=0;k<4;k++)
                Byte4LUT[lr][i][k]=BrightCLUT[lr][(i>>(2*k))&3];
              for(int lr=0;lr<2;lr++) for(int b=0;b<256;b++){
                uint32_t old_out[4], new_out[4], bits=b;
                for(int k=0;k<4;k++){ old_out[k]=BrightCLUT[lr][bits&3]; bits>>=2; }
                for(int k=0;k<4;k++) new_out[k]=Byte4LUT[lr][b][k];
                for(int k=0;k<4;k++) if(old_out[k]!=new_out[k]){ printf("MISMATCH\n"); return 1; }
              }
            }
            printf("equivalent over all bytes, 10000 random palettes\n"); return 0;
          }
          TEST_EOF
          gcc -O2 -Wall -o /tmp/eqtest /tmp/vb-anaglyph-lut-test.c
          /tmp/eqtest

      - name: Apply source patch (anaglyph LUT)
        run: |
          cat > /tmp/vb-anaglyph-lut.patch <<'PATCH_EOF'
          --- a/mednafen/vb/vip.c
          +++ b/mednafen/vb/vip.c
          @@ -92,6 +92,10 @@
           static uint32 ColorLUT[2][256];
           static int32 BrightnessCache[4];
           static uint32 BrightCLUT[2][4];
          +/* Byte4LUT[lr][b][k] = pixel for 2-bit colour index (b >> 2k) & 3.
          + * Rebuilt whenever BrightCLUT is rebuilt, so the copy loops can expand
          + * four framebuffer pixels per table lookup. */
          +static uint32 Byte4LUT[2][256][4];
           
           static double ColorLUTNoGC[2][256][3];
           static uint32 AnaSlowColorLUT[256][256];
          @@ -220,6 +224,14 @@
              for(lr = 0; lr < 2; lr++)
                 for(i = 0; i < 4; i++)
                    BrightCLUT[lr][i] = ColorLUT[lr][BrightnessCache[i]];
          +
          +   for(lr = 0; lr < 2; lr++)
          +      for(i = 0; i < 256; i++)
          +      {
          +         int k;
          +         for(k = 0; k < 4; k++)
          +            Byte4LUT[lr][i][k] = BrightCLUT[lr][(i >> (2 * k)) & 3];
          +      }
           }
           
           static void Recalc3DModeStuff(bool non_rgb_output)
          @@ -872,16 +884,14 @@
                 {
                    for(y = 56; y; y--)
                    {
          -            uint32 source_bits = *fb_source;
          +            const uint32 *px = Byte4LUT[lr][*fb_source];
          +
          +            target[0 * pitchinpix] |= px[0];
          +            target[1 * pitchinpix] |= px[1];
          +            target[2 * pitchinpix] |= px[2];
          +            target[3 * pitchinpix] |= px[3];
           
          -            for(y_sub = 4; y_sub; y_sub--)
          -            {
          -               uint32 pixel  = BrightCLUT[lr][source_bits & 3];
          -               *target      |= pixel;
          -
          -               source_bits >>= 2;
          -               target       += pitchinpix;
          -            }
          +            target += 4 * pitchinpix;
                       fb_source++;
                    }
                 }
          @@ -889,16 +899,14 @@
                 {
                    for(y = 56; y; y--)
                    {
          -            uint32 source_bits = *fb_source;
          +            const uint32 *px = Byte4LUT[lr][*fb_source];
          +
          +            target[0 * pitchinpix] = px[0];
          +            target[1 * pitchinpix] = px[1];
          +            target[2 * pitchinpix] = px[2];
          +            target[3 * pitchinpix] = px[3];
           
          -            for(y_sub = 4; y_sub; y_sub--)
          -            {
          -               uint32 pixel  = BrightCLUT[lr][source_bits & 3];
          -               *target       = pixel;
          -
          -               source_bits >>= 2;
          -               target       += pitchinpix;
          -            }
          +            target += 4 * pitchinpix;
                       fb_source++;
                    }
                 }
          PATCH_EOF
          git apply --check /tmp/vb-anaglyph-lut.patch
          git apply /tmp/vb-anaglyph-lut.patch
          grep -c "Byte4LUT" mednafen/vb/vip.c

      - name: Setup NDK r23c (cached)
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          add-to-path: false
          local-cache: true

      - name: Patch jni/Android.mk (ARM mode, no exceptions/RTTI)
        run: |
          sed -i '/^LOCAL_MODULE/a LOCAL_ARM_MODE := arm' jni/Android.mk
          sed -i '/^LOCAL_CPP_FEATURES/d' jni/Android.mk
          grep -n "LOCAL_MODULE\|LOCAL_ARM_MODE\|LOCAL_CPP_FEATURES" jni/Android.mk || true

      - name: Build (official ndk-build in jni/)
        working-directory: jni
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # r23c's minimum platform is android-16; the code runs on 4.0.4 (API 15)
          # as long as no API 16+ symbols are pulled in.
          "$NDK/ndk-build" -j"$(nproc)" \
            APP_ABI=armeabi-v7a \
            APP_PLATFORM=android-16 \
            APP_STL=c++_static \
            APP_OPTIM=release \
            HAVE_GLES="$ENABLE_GLES" \
            HAVE_VR="$ENABLE_VR" \
            APP_CFLAGS="$OPT_FLAGS" \
            APP_CPPFLAGS="$OPT_FLAGS $CXX_OPT_FLAGS" \
            APP_LDFLAGS="$LD_OPT_FLAGS"

      - name: Verify ARM/Thumb, NEON and symbols
        run: |
          BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          UNSTRIPPED=obj/local/armeabi-v7a/libretro.so
          SO=libs/armeabi-v7a/libretro.so
          echo "ARM-mode symbols:   $($BIN/llvm-readelf -s $UNSTRIPPED | grep -c ' \$a')"
          echo "Thumb-mode symbols: $($BIN/llvm-readelf -s $UNSTRIPPED | grep -c ' \$t')"
          $BIN/llvm-readelf -A $SO
          echo "--- needed libs ---"
          $BIN/llvm-readelf -d $SO | grep NEEDED
          echo "--- undefined symbols ---"
          $BIN/llvm-nm -D --undefined-only $SO
          echo "--- NEON instruction count (q-register ops) ---"
          $BIN/llvm-objdump -d $UNSTRIPPED | grep -cE '\sv[a-z0-9.]+\s+q[0-9]' || true

      - name: Package core
        run: |
          mkdir -p out
          cp libs/armeabi-v7a/libretro.so out/mednafen_vb_libretro_android.so
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mednafen_vb_libretro_android-armv7-neon
          path: out/mednafen_vb_libretro_android.so
          if-no-files-found: error
