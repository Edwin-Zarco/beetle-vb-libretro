name: Build beetle-vb (Android 4.0.4, Xperia Play)

on: [push, pull_request, workflow_dispatch]

env:
  OPT_FLAGS: >-
    -O3 -marm -DNDEBUG -mcpu=cortex-a8 -mtune=cortex-a8 -mfpu=neon -mfloat-abi=softfp
    -ffast-math -fno-math-errno -funroll-loops -fvectorize -fslp-vectorize
    -fomit-frame-pointer -fno-stack-protector -fno-ident -fno-plt
    -fmerge-all-constants -fvisibility=hidden -fno-unwind-tables
    -fno-asynchronous-unwind-tables -fdata-sections -ffunction-sections -flto
  CXX_OPT_FLAGS: -fno-exceptions -fno-rtti
  LD_OPT_FLAGS: >-
    -flto -Wl,--lto-O3 -Wl,--gc-sections -Wl,--icf=all -Wl,-O2 -Wl,--as-needed
    -Wl,--hash-style=both -Wl,--build-id=none -Wl,-z,norelro -Wl,--exclude-libs,ALL

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply anaglyph LUT patch
        run: |
          cat > /tmp/vb.patch <<'PATCH_EOF'
          --- a/mednafen/vb/vip.c
          +++ b/mednafen/vb/vip.c
          @@ -92,6 +92,10 @@
           static uint32 ColorLUT[2][256];
           static int32 BrightnessCache[4];
           static uint32 BrightCLUT[2][4];
          +/* Byte4LUT[lr][b][k] = pixel for 2-bit colour index (b >> 2k) & 3.
          + * Rebuilt whenever BrightCLUT is rebuilt, so the copy loops can expand
          + * four framebuffer pixels per table lookup. */
          +static uint32 Byte4LUT[2][256][4];
           
           static double ColorLUTNoGC[2][256][3];
           static uint32 AnaSlowColorLUT[256][256];
          @@ -220,6 +224,14 @@
              for(lr = 0; lr < 2; lr++)
                 for(i = 0; i < 4; i++)
                    BrightCLUT[lr][i] = ColorLUT[lr][BrightnessCache[i]];
          +
          +   for(lr = 0; lr < 2; lr++)
          +      for(i = 0; i < 256; i++)
          +      {
          +         int k;
          +         for(k = 0; k < 4; k++)
          +            Byte4LUT[lr][i][k] = BrightCLUT[lr][(i >> (2 * k)) & 3];
          +      }
           }
           
           static void Recalc3DModeStuff(bool non_rgb_output)
          @@ -872,16 +884,14 @@
                 {
                    for(y = 56; y; y--)
                    {
          -            uint32 source_bits = *fb_source;
          +            const uint32 *px = Byte4LUT[lr][*fb_source];
          +
          +            target[0 * pitchinpix] |= px[0];
          +            target[1 * pitchinpix] |= px[1];
          +            target[2 * pitchinpix] |= px[2];
          +            target[3 * pitchinpix] |= px[3];
           
          -            for(y_sub = 4; y_sub; y_sub--)
          -            {
          -               uint32 pixel  = BrightCLUT[lr][source_bits & 3];
          -               *target      |= pixel;
          -
          -               source_bits >>= 2;
          -               target       += pitchinpix;
          -            }
          +            target += 4 * pitchinpix;
                       fb_source++;
                    }
                 }
          @@ -889,16 +899,14 @@
                 {
                    for(y = 56; y; y--)
                    {
          -            uint32 source_bits = *fb_source;
          +            const uint32 *px = Byte4LUT[lr][*fb_source];
          +
          +            target[0 * pitchinpix] = px[0];
          +            target[1 * pitchinpix] = px[1];
          +            target[2 * pitchinpix] = px[2];
          +            target[3 * pitchinpix] = px[3];
           
          -            for(y_sub = 4; y_sub; y_sub--)
          -            {
          -               uint32 pixel  = BrightCLUT[lr][source_bits & 3];
          -               *target       = pixel;
          -
          -               source_bits >>= 2;
          -               target       += pitchinpix;
          -            }
          +            target += 4 * pitchinpix;
                       fb_source++;
                    }
                 }
          PATCH_EOF
          git apply /tmp/vb.patch

      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          add-to-path: false

      - name: Patch Android.mk
        run: |
          sed -i '/^LOCAL_MODULE/a LOCAL_ARM_MODE := arm' jni/Android.mk
          sed -i '/^LOCAL_CPP_FEATURES/d' jni/Android.mk

      - name: Build
        working-directory: jni
        run: |
          "${{ steps.ndk.outputs.ndk-path }}/ndk-build" -j"$(nproc)" \
            APP_ABI=armeabi-v7a APP_PLATFORM=android-16 APP_STL=c++_static \
            APP_OPTIM=release HAVE_GLES=0 HAVE_VR=0 \
            APP_CFLAGS="$OPT_FLAGS" APP_CPPFLAGS="$OPT_FLAGS $CXX_OPT_FLAGS" \
            APP_LDFLAGS="$LD_OPT_FLAGS"

      - uses: actions/upload-artifact@v7
        with:
          name: mednafen_vb_libretro_android-armv7-neon
          path: libs/armeabi-v7a/libretro.so
